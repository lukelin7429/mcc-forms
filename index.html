<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名專區 · 人師教育協會 My Culture Connect</title>
<meta name="description" content="人師教育協會 報名專區">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noticia+Text:wght@400;700&family=Questrial&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  .hub-intro{
    max-width:var(--max);
    margin:0 auto 26px;
    text-align:center;
    font-size:16px;
    color:var(--ink-soft);
    line-height:1.75;
  }

  .cards{
    max-width:var(--max);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 26px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .05s ease;
  }
  .card:hover{
    border-color:var(--brand);
    box-shadow:0 14px 36px -18px rgba(245,130,32,.30);
  }
  .card:active{transform:translateY(1px);}

  .card-title{
    font-family:'Noticia Text','PingFang TC',serif;
    font-weight:400;
    font-size:22px;
    color:var(--brand-deep);
    line-height:1.35;
    margin-bottom:4px;
  }
  .card-title .en{
    font-family:'Questrial','PingFang TC',sans-serif;
    font-size:13px;
    color:var(--ink-muted);
    letter-spacing:.08em;
    margin-left:8px;
    text-transform:uppercase;
  }
  .card-desc{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
    margin-top:6px;
  }
  .card-go{
    font-family:'Questrial','PingFang TC',sans-serif;
    font-size:13px;
    color:var(--brand);
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-top:14px;
    display:inline-block;
  }
  .card-go::after{content:' →';}
</style>
</head>
<body>

<header class="mcc-header">
  <a class="logo" href="https://www.mycultureconnect.org" target="_blank" rel="noopener">
    <img src="assets/mcc-logo.png" alt="My Culture Connect logo">
  </a>
  <div class="brand-name">
    人師教育協會
    <span class="en">My Culture Connect</span>
  </div>
  <div class="form-title">報名專區 Registration</div>
  <div class="rule"></div>
</header>

<div class="hub-intro">
  歡迎，請選擇要報名的項目。
</div>

<div class="cards">

  <a class="card" href="ny-chinese-school/">
    <div class="card-title">紐約中文學校 學生報名<span class="en">NY Chinese School</span></div>
    <div class="card-desc">給紐約中文學校學生的免費英語家教媒合。一至九年級。</div>
    <div class="card-go">前往報名</div>
  </a>

  <a class="card" href="tutoring/">
    <div class="card-title">一對一英語上課<span class="en">1-on-1 Tutoring</span></div>
    <div class="card-desc">一對一英語教學媒合。學生與成人自學者皆可報名。</div>
    <div class="card-go">前往報名</div>
  </a>

</div>

<footer>人師教育協會 My Culture Connect</footer>

</body>
</html>
